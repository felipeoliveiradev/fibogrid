# GitHub Pages (Vite) is retired.
# Public site is the Next.js app in /site — deploy on Vercel with Root Directory = site.
#
# To re-enable Pages temporarily, restore the previous workflow from git history.
name: site-note

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages retired
        run: |
          echo "Deploy the Next.js site from /site on Vercel."
          echo "Set NEXT_PUBLIC_SITE_URL to your production origin."
